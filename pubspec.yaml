name: app_alfardos
description: "Al-Firdous Metalworking Factory Management Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Icons ─────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.9.1       # مستخدم في customer_service.dart
  awesome_dialog: ^3.3.0
  flutter_screenutil: ^5.9.3

  # ── Splash & Launcher ──────────────────────────────────────
  flutter_native_splash: ^2.4.5
  flutter_launcher_icons: ^0.14.4

  # ── State Management ───────────────────────────────────────
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0                        # مستخدم مباشرةً في الـ cubits (import package:bloc/bloc.dart)
  equatable: ^2.0.7
  meta: ^1.17.0

  # ── Firebase ───────────────────────────────────────────────
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.1.0
  firebase_app_check: ^0.4.1+2
  google_sign_in: ^6.2.1             # تم تصحيح: أُضيفت ^ للسماح بتحديثات patch

  # ── Storage & Files ────────────────────────────────────────
  cloudinary_public: ^0.23.1          # مستخدم لرفع الصور في 4 ملفات
  file_picker: ^10.3.3
  open_file: ^3.5.10
  image_picker: ^1.2.1
  path_provider: ^2.1.5

  # ── Networking ─────────────────────────────────────────────
  dio: ^5.9.0                         # تم حذف http لأن dio يغطي كل شيء

  # ── Notifications ──────────────────────────────────────────
  flutter_local_notifications: ^19.5.0  # مستخدم في notification_service.dart

  # ── Utilities ──────────────────────────────────────────────
  url_launcher: ^6.3.2
  intl: ^0.20.2

  # ── REMOVED PACKAGES (سبب الحذف) ──────────────────────────
  # responsive_framework  ← محذوف: لا يُستخدم في أي ملف dart
  # responsive_builder    ← محذوف: لا يُستخدم في أي ملف dart
  # responsive_wrapper    ← محذوف: لا يُستخدم في أي ملف dart
  # http                  ← محذوف: dio يغطي نفس الوظيفة (http غير مستخدم)
  # easy_localization     ← محذوف: التطبيق يستخدم flutter_localizations مباشرةً
  # uuid                  ← محذوف: لا يُستخدم في أي ملف dart
  # appcheck              ← محذوف: firebase_app_check يغني عنه تماماً

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - asset/image/
    - asset/icons/

# ── Splash Screen ──────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#ffffff"
  image: asset/image/splash_screen.jpg   # تم تصحيح الاسم: splach → splash
  android: true
  ios: true
  ios_content_mode: scaleAspectFit       # تم الإضافة: مهم لعرض صحيح على iOS
  android_gravity: fill

# ── Launcher Icons ─────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asset/image/app_icon.png"
  windows:
    generate: true
    image_path: "asset/image/app_icon.png"   # تم الإضافة: كانت مفقودة وتسبب مشاكل
    icon_size: 48
