name: iOS Build (Flutter)

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean Flutter
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Fix iOS Podfile
        run: |
          python3 -c "
          content = open('ios/Podfile').read()
          content = content.replace(\"# platform :ios, '12.0'\", \"platform :ios, '14.0'\")
          content = content.replace(\"platform :ios, '12.0'\", \"platform :ios, '14.0'\")
          content = content.replace(\"platform :ios, '13.0'\", \"platform :ios, '14.0'\")
          open('ios/Podfile', 'w').write(content)
          print('Done:', open('ios/Podfile').readline())
          "
          # إضافة IPHONEOS_DEPLOYMENT_TARGET في post_install
          python3 -c "
          content = open('ios/Podfile').read()
          old = 'flutter_additional_ios_build_settings(target)'
          new = '''flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings[\"IPHONEOS_DEPLOYMENT_TARGET\"] = \"14.0\"
              end'''
          if 'IPHONEOS_DEPLOYMENT_TARGET' not in content:
              content = content.replace(old, new)
          open('ios/Podfile', 'w').write(content)
          print('Podfile fixed')
          "
          cat ios/Podfile

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Pod install
        run: cd ios && pod install --repo-update

      - name: Build iOS IPA (no codesign)
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/ipa/*.ipa